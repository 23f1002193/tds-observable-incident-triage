services:
  - type: web
    name: tds-observable-incident-triage
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: DATABASE_PATH
        value: /var/data/incident.db
    disk:
      name: incident-data
      mountPath: /var/data
      sizeGB: 1
